# Dataset / data-loading configuration.
# Tuned for RTX A4500 (20GB, 32 threads): batch 48 ~5.9GB train peak.
data_root: dataset
dataset_subdir: lerobot3.0
batch_size: 48
num_workers: 12
val_fraction: 0.2
val_batches: 20
chunk_size: 13
video_backend: pyav
pin_memory: true
prefetch_factor: 4
persistent_workers: true
seed: 0

# Data facts (fps, dims, image sizes) are auto-derived from the dataset metadata.
# Leave fps_override as null to use the recorded fps.
fps_override: null

normalize_actions: true
normalize_state: true
normalize_tactile: true
normalize_torque: true
